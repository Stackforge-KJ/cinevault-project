<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movies | CineVault</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header class="site-header wrap" id="site-header"></header>
  <main class="wrap" id="main"><h1 class="page-title">Movies</h1>
    <div class="toolbar">
      <div class="filters" id="filters" role="group" aria-label="Genre"></div>
      <input class="field grow" id="q" type="search" placeholder="Search movies..." aria-label="Search movies">
      <select class="field" id="sort" aria-label="Sort by">
        <option value="rating">Sort by: Rating</option>
        <option value="year">Sort by: Newest</option>
        <option value="title">Sort by: A-Z</option>
      </select>
    </div>
    <div class="grid" id="grid"></div></main>
  <footer class="site-footer wrap">CineVault &bull; Stream and download</footer>
  <script type="module" src="js/pages/movies.js"></script>
</body>
</html>
